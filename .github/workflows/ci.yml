name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          brew install gitleaks
          gitleaks git --redact --no-banner
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install build tools
        run: brew install xcodegen ripgrep
      - name: Static boundaries and approval regressions
        run: |
          bash scripts/check-core-portability.sh
          bash scripts/check-ios-private-apis.sh --self-test
          bash scripts/check-ios-private-apis.sh
          bash scripts/check-user-facing-names.sh
          bash scripts/check-reader-offmain.sh --self-test
          bash scripts/check-reader-offmain.sh
          bash scripts/test-approval-decisions.sh
          bash scripts/test-widget-app-group.sh
          bash scripts/test-screen-geometry.sh
          bash scripts/test-safe-links.sh
      - name: Pinned Atlas helper
        run: python3 scripts/build-atlas-helper.py --test --output .build/NotchLeeAtlas
      - name: Generate project
        run: xcodegen generate --spec OmniFlow/project.yml
      - name: Install Apple Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build macOS (unsigned)
        run: >-
          xcodebuild -project OmniFlow/OmniFlow.xcodeproj -scheme OmniFlow
          -configuration Release -derivedDataPath .build/DerivedData
          -clonedSourcePackagesDirPath .build/SourcePackages -jobs 4
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build iOS (unsigned simulator)
        run: >-
          xcodebuild -project OmniFlow/OmniFlow.xcodeproj -scheme OmniFlowiOS
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/DerivedData -clonedSourcePackagesDirPath .build/SourcePackages
          -jobs 4 CODE_SIGNING_ALLOWED=NO build

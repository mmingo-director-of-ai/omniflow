[extend]
useDefault = true

# Exact public model checksums, not credentials. Do not allowlist whole source files.
[[allowlists]]
description = "Pinned tokenizer SHA-256 digests"
regexTarget = "secret"
regexes = [
  '^ad47af68eb0dfcc868258957578831a793a15858b88e2f8325d644fc77f4fb1c$',
  '^c8ee8927ebec39b93edf7333e7ded950299c643a569a601bb7bac9dc94d1f648$',
]

# Machine-generated SHA-256-only vendor manifest, verified by the build helper.
[[allowlists]]
description = "Vendored source integrity manifest"
paths = ['(^|/)Vendor/atlas-sdk-manifest\.json$']
